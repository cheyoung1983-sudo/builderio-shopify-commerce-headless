<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 80" width="390" height="80" fill="none">
  <defs>
    <!-- Warm Sumi Slate Emblem Canvas -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262c" />
      <stop offset="100%" stop-color="#141518" />
    </linearGradient>

    <!-- Japanese Persimmon Vermillion Gradient -->
    <linearGradient id="persimmonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f62" />
      <stop offset="60%" stop-color="#e05332" />
      <stop offset="100%" stop-color="#c84223" />
    </linearGradient>

    <!-- Celadon Mineral Jade Gradient -->
    <linearGradient id="celadonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Glass Specular Reflection -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#141518" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- ==================== EMBLEM (Left: 0 - 72) ==================== -->
  <g transform="translate(4, 4)">
    <!-- Base Squircle with Tactile Stone Border -->
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#emblemBg)" filter="url(#softShadow)" />
    <rect x="0" y="0" width="72" height="72" rx="18" stroke="#3c3f46" stroke-width="1.2" />

    <!-- Smartphone Glass Display Frame -->
    <rect x="15" y="10" width="42" height="52" rx="7" fill="#141518" stroke="#3c3f46" stroke-width="1" />

    <!-- Speaker Notch -->
    <rect x="30" y="13" width="12" height="2" rx="1" fill="#585c66" />
    <circle cx="44" cy="14" r="0.9" fill="#2dd4bf" />

    <!-- Active OLED Display Area -->
    <rect x="18" y="17" width="36" height="39" rx="4" fill="#0d0e11" />

    <!-- Stylized Precision 'D' / 'P' Monogram Glyph in Persimmon -->
    <rect x="24" y="22" width="4.5" height="27" rx="2.25" fill="url(#persimmonGrad)" />

    <!-- Loop -->
    <path d="M 28 22 
             H 39 
             C 45 22, 48 26, 48 31 
             C 48 36, 45 40, 39 40 
             H 28" 
          fill="none" 
          stroke="url(#persimmonGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Precision Display Reticle Notch in Celadon -->
    <circle cx="39" cy="31" r="1.6" fill="url(#celadonGrad)" />

    <!-- Accent Dot in Persimmon -->
    <circle cx="38" cy="46" r="2.6" fill="url(#persimmonGrad)" />

    <!-- Glass Specular Reflection Sheen -->
    <path d="M 15 10 H 57 C 57 10, 57 24, 50 32 C 38 40, 24 35, 15 25 Z" fill="url(#glassSheen)" />

    <!-- Bottom Home Indicator in Celadon -->
    <rect x="29" y="58" width="14" height="1.4" rx="0.7" fill="#0d9488" opacity="0.8" />
  </g>

  <!-- ==================== TYPOGRAPHY (Right) ==================== -->
  <g transform="translate(94, 0)">
    <!-- Brand Title: DISPLAY CELL -->
    <text x="0" y="42" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="24" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#141518">
      DISPLAY<tspan dx="8" font-weight="600" fill="#585c66">CELL</tspan>
    </text>

    <!-- PROS Pill Badge in Persimmon -->
    <g transform="translate(208, 22)">
      <rect x="0" y="0" width="68" height="24" rx="6" fill="url(#persimmonGrad)" />
      <text x="34" y="16.5" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="12" 
            font-weight="900" 
            letter-spacing="2" 
            fill="#ffffff" 
            text-anchor="middle">
        PROS
      </text>
    </g>

    <!-- Subtitle: Precision Screens & Parts in Celadon Jade -->
    <text x="1" y="60" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="9.5" 
          font-weight="700" 
          letter-spacing="2.8" 
          fill="#0d9488">
      PRECISION SCREENS &#8226; DIGITIZERS &#8226; OEM
    </text>
  </g>
</svg>
