<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <!-- Warm Tactile Stone Canvas -->
    <radialGradient id="h2Bg" cx="45%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#faf9f5" />
      <stop offset="100%" stop-color="#f2efe7" />
    </radialGradient>

    <!-- Persimmon Beam -->
    <linearGradient id="h2PersimmonBeam" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#ffae9b" />
      <stop offset="60%" stop-color="#e05332" />
      <stop offset="100%" stop-color="#c84223" />
    </linearGradient>

    <!-- Celadon Beam -->
    <linearGradient id="h2CeladonBeam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#99f6e4" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Glass Lens Gradient -->
    <radialGradient id="h2LensGlass" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f4f6f8" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#e2e8f0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </radialGradient>

    <!-- Subtle Dot Matrix -->
    <pattern id="dotMatrix" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#dcd8ce" />
    </pattern>

    <filter id="h2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="h2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#141518" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#h2Bg)" />
  <rect width="1920" height="1080" fill="url(#dotMatrix)" opacity="0.65" />

  <!-- Technical Axis and Calibration Rings -->
  <g transform="translate(1120, 540)">
    <!-- Outer Calibration Dial -->
    <circle cx="0" cy="0" r="380" fill="none" stroke="#e7e5df" stroke-width="1.2" stroke-dasharray="3 6" />
    <circle cx="0" cy="0" r="320" fill="none" stroke="#e7e5df" stroke-width="1" />
    <circle cx="0" cy="0" r="260" fill="none" stroke="#e05332" stroke-width="1" stroke-dasharray="1 12" opacity="0.4" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="#0d9488" stroke-width="1" stroke-dasharray="8 8" opacity="0.5" />

    <!-- Degree Marks -->
    <line x1="0" y1="-380" x2="0" y2="-360" stroke="#0d9488" stroke-width="2" />
    <line x1="380" y1="0" x2="360" y2="0" stroke="#e05332" stroke-width="2" />
    <line x1="0" y1="380" x2="0" y2="360" stroke="#141518" stroke-width="2" />
    <line x1="-380" y1="0" x2="-360" y2="0" stroke="#141518" stroke-width="2" />
  </g>

  <!-- ==================== DISPERSION RAYS ==================== -->
  <g filter="url(#h2Glow)" opacity="0.85">
    <!-- Incident White-Light Beam -->
    <polygon points="200,535 1120,538 1120,542 200,545" fill="#141518" opacity="0.15" />
    <line x1="200" y1="540" x2="1120" y2="540" stroke="#141518" stroke-width="3" stroke-linecap="round" />

    <!-- Refracted Persimmon Fan Ray -->
    <polygon points="1120,540 1860,260 1860,380 1120,540" fill="url(#h2PersimmonBeam)" opacity="0.8" />
    
    <!-- Refracted Celadon Fan Ray -->
    <polygon points="1120,540 1860,680 1860,820 1120,540" fill="url(#h2CeladonBeam)" opacity="0.75" />
    
    <!-- Core Refraction Point -->
    <circle cx="1120" cy="540" r="12" fill="#ffffff" stroke="#e05332" stroke-width="3" />
    <circle cx="1120" cy="540" r="5" fill="#0d9488" />
  </g>

  <!-- ==================== FLOATING OPTICAL SAPPHIRE LENS ==================== -->
  <g transform="translate(1120, 540)" filter="url(#h2Shadow)">
    <!-- Lens Body -->
    <circle cx="0" cy="0" r="220" fill="url(#h2LensGlass)" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="217" fill="none" stroke="#e7e5df" stroke-width="1.5" />

    <!-- Curvature Highlight -->
    <path d="M -150 -150 A 220 220 0 0 1 150 -150" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75" />
    
    <!-- Secondary Internal Refraction Crescent -->
    <path d="M -60 160 A 180 180 0 0 1 160 -60" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Glass Specular Slices -->
    <path d="M -80 -180 L 140 40 L 110 50 L -110 -170 Z" fill="#ffffff" opacity="0.3" />

    <!-- Center Crosshairs -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#141518" stroke-width="1.2" opacity="0.6" />
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#141518" stroke-width="1.2" opacity="0.6" />
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#141518" stroke-width="1.2" opacity="0.6" />
  </g>

  <!-- ==================== TYPOGRAPHY / SPECIFICATION ==================== -->
  <g transform="translate(240, 460)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#e05332">
      FIG. 02 — OPTICAL DISPERSION
    </text>
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#141518">
      Color Gamut Spectrum
    </text>
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#585c66" letter-spacing="0.2">
      DCI-P3 calibrated color fidelity and anti-reflective sapphire optics.
    </text>

    <!-- Specs Badge -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="168" height="32" rx="16" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#0d9488" />
      <text x="28" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#0d9488">
        100% DCI-P3 &#8226; DELTA E &lt; 1
      </text>
    </g>
  </g>
</svg>
