name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Check Node version consistency
        run: npm run check:node-version
      - name: Check project health
        run: npm run check:project-health
      - name: Check CI/config integrity
        run: npm run check:ci-integrity
      - name: Check dependency health
        run: npm run check:dependency-health
      - name: Type-check
        run: npm run typecheck
      - name: Run ESLint
        run: npm run lint
      - name: Check for hardcoded secrets
        run: npm run check:secrets
      - name: Check Customer Account API login flow health
        run: npm run check:customer-account-auth-health
      - name: Check XSS hardening (CSP, JSON-LD, sanitized HTML)
        run: npm run check:xss-hardening
      - name: Run accessibility lint
        run: npm run lint:a11y
      - name: Run accessibility tests (axe)
        run: npm run test:a11y
      - name: Build production bundle
        run: npm run build
