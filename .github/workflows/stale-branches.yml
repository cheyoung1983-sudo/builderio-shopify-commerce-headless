name: Stale branch report

on:
  schedule:
    - cron: '0 15 * * 1' # every Monday, 15:00 UTC
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Report stale branches
        run: node scripts/check-stale-branches.js >> "$GITHUB_STEP_SUMMARY"
